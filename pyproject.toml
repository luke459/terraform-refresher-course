[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "tfprep"
version = "0.1.0"
description = "Local Terraform Associate 004 refresher course"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.163.0", "uvicorn==0.54.0", "pydantic==2.14.3",
  "boto3==1.44.3", "httpx==0.28.1", "typer==0.29.1",
  "PyYAML==6.0.2", "python-hcl2==8.2.0", "jsonschema==4.23.0",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[project.scripts]
tfprep = "runner.cli.main:app"

[tool.setuptools.packages.find]
include = ["runner*"]

[tool.setuptools.package-data]
"runner.api" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

